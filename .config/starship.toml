"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) | "

[directory]
style = "bold cyan"
format = "[  $path]($style) "

[time]
disabled = false
time_format = "%T"
format = '[╰\($time\)─ ]($style)'
style = "bright-white"

[status]
disabled = false
style = "bold red"
format= '[\[$status\] ]($style)'

[character]
success_symbol = '[✦](bold yellow)'
error_symbol = "[󰋔](bold red)"

[git_branch]
symbol = " "

[package]
symbol = "󰏖 "

[c]
symbol = " "

[python]
symbol = "󰌠 "

[golang]
symbol = " "

format = """
$username\
$hostname\
$time\
$directory\
$git_branch\
$git_status\
$status\
$character\
"""
