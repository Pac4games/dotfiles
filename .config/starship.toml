"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

[time]
disabled = false
time_format = "%T"
format = '[╰\($time\)─ ]($style)'
style = "bright-white"

[status]
disabled = false
style = "bold red"
format= '[\[$status\] ]($style)'

[character]
success_symbol = '[✦](bold yellow)'
error_symbol = "[󰋔](bold red)"

[git_branch]
symbol = " "

[package]
symbol = "󰏖 "

[c]
symbol = " "

[python]
symbol = "󰌠 "

[golang]
symbol = " "

format = """
$time\
$directory\
$git_branch\
$git_status\
$status\
$character\
"""
